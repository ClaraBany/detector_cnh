<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificador de CNH</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 500px;
    }
    h1 {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 2px dashed #ccc;
      border-radius: 8px;
      cursor: pointer;
      background: #fafafa;
    }
    input[type="file"]:hover {
      border-color: #007bff;
    }
    #preview {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 8px;
      display: none;
      border: 1px solid #ddd;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #aacdff;
      cursor: not-allowed;
    }
    #loading {
      margin-top: 15px;
      text-align: center;
      color: #666;
      font-weight: 500;
      display: none;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: #e9ecef;
      display: none;
    }
    #result h3 {
      margin-bottom: 10px;
      color: #212529;
    }
    .prob-list {
      margin-top: 10px;
      list-style-type: none;
    }
    .prob-list li {
      font-size: 0.9rem;
      color: #495057;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Classificador de CNH 🪪</h1>
    
    <div class="form-group">
      <label for="fileInput">Selecione a imagem do documento:</label>
      <input type="file" id="fileInput" accept="image/*" onchange="mostrarPreview(event)">
      <img id="preview" alt="Pré-visualização da imagem">
    </div>

    <button id="btnEnviar" onclick="enviarImagem()">Analisar Documento</button>

    <div id="loading">⏳ Processando imagem (pode levar alguns segundos)...</div>

    <div id="result">
      <h3>Resultado:</h3>
      <p><strong>Classe:</strong> <span id="resLabel">-</span></p>
      <p><strong>Confiança:</strong> <span id="resConfianca">-</span></p>
      <p><strong>Tempo:</strong> <span id="resTempo">-</span></p>
      
      <div style="margin-top: 10px;">
        <strong>Probabilidades:</strong>
        <ul class="prob-list" id="resProbabilidades"></ul>
      </div>
    </div>
  </div>

  <script>
    // URL da sua API no Hugging Face (Ajuste caso tenha API_KEY configurada)
    const API_URL = "https://clarabany-modelo-cnh.hf.space/predict"; 
    
    // Se você configurou API_KEY nas variáveis de ambiente do Hugging Face, coloque aqui:
    const API_KEY = ""; 

    function mostrarPreview(event) {
      const file = event.target.files[0];
      const preview = document.getElementById('preview');
      
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(file);
      } else {
        preview.style.display = 'none';
      }
    }

    async function enviarImagem() {
      const fileInput = document.getElementById('fileInput');
      const btnEnviar = document.getElementById('btnEnviar');
      const loading = document.getElementById('loading');
      const resultDiv = document.getElementById('result');
      
      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Por favor, selecione uma imagem primeiro!");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      // Atualiza interface para estado de carregamento
      btnEnviar.disabled = true;
      loading.style.display = 'block';
      resultDiv.style.display = 'none';

      try {
        const headers = {};
        if (API_KEY) {
          headers["X-API-Key"] = API_KEY;
        }

        const response = await fetch(API_URL, {
          method: "POST",
          headers: headers,
          body: formData
        });

        if (!response.ok) {
          throw new Error(`Erro na API (${response.status}): ${await response.text()}`);
        }

        const data = await response.json();
        
        // Exibe os resultados na tela
        document.getElementById('resLabel').innerText = data.label;
        document.getElementById('resConfianca').innerText = (data.confianca * 100).toFixed(2) + "%";
        document.getElementById('resTempo').innerText = data.tempo_ms ? `${data.tempo_ms} ms` : 'N/A';

        // Preenche as probabilidades
        const probList = document.getElementById('resProbabilidades');
        probList.innerHTML = "";
        if (data.probabilidades) {
          for (const [classe, prob] of Object.entries(data.probabilidades)) {
            const li = document.createElement('li');
            li.innerHTML = `• <strong>${classe}:</strong> ${(prob * 100).toFixed(2)}%`;
            probList.appendChild(li);
          }
        }

        resultDiv.style.display = 'block';

      } catch (error) {
        alert("Ocorreu um erro ao processar a requisição: " + error.message);
        console.error(error);
      } finally {
        btnEnviar.disabled = false;
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>
